{% extends "base.html" %}

{% block title %}Login - Smart Personal Finance System{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 3rem auto;">
  <div class="card">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <h2 style="font-size: 1.5rem; color: var(--secondary); margin-bottom: 0.25rem;">Welcome Back</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Log in to access your financial dashboard.</p>
    </div>

    <form method="POST" action="{{ url_for('login') }}">
      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" placeholder="name@example.com" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="Your password" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Log In</button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border); font-size: 0.9rem;">
      Don't have an account yet? <a href="{{ url_for('register') }}" style="color: var(--primary); text-decoration: none; font-weight: 500;">Register here</a>
    </div>
  </div>
</div>
{% endblock %}

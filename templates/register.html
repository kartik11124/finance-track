{% extends "base.html" %}

{% block title %}Register - Smart Personal Finance System{% endblock %}

{% block content %}
<div style="max-width: 460px; margin: 3rem auto;">
  <div class="card">
    <div style="text-align: center; margin-bottom: 1.5rem;">
      <h2 style="font-size: 1.5rem; color: var(--secondary); margin-bottom: 0.25rem;">Create an Account</h2>
      <p style="color: var(--text-muted); font-size: 0.9rem;">Start tracking your budget, savings, and investments.</p>
    </div>

    <form method="POST" action="{{ url_for('register') }}">
      <div class="form-group">
        <label class="form-label" for="name">Full Name</label>
        <input type="text" class="form-control" id="name" name="name" value="{{ name or '' }}" placeholder="e.g. Rahul Sharma" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address</label>
        <input type="email" class="form-control" id="email" name="email" value="{{ email or '' }}" placeholder="name@example.com" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="At least 6 characters" minlength="6" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="confirm_password">Confirm Password</label>
        <input type="password" class="form-control" id="confirm_password" name="confirm_password" placeholder="Repeat your password" minlength="6" required>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Register Account</button>
    </form>

    <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.25rem; border-top: 1px solid var(--border); font-size: 0.9rem;">
      Already have an account? <a href="{{ url_for('login') }}" style="color: var(--primary); text-decoration: none; font-weight: 500;">Log in here</a>
    </div>
  </div>
</div>
{% endblock %}
